server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers.
    # NOTE: nginx `add_header` does NOT inherit into a block that defines its own
    # `add_header`, so these are repeated in the static-asset location below.
    # `always` applies them to error responses too.
    #
    # The Content-Security-Policy line is GENERATED — it must stay byte-identical to
    # `nginxCspHeaderLine()` in build/csp.ts, which is the same policy the build-only
    # Vite plugin injects as a <meta> tag for the GitHub Pages deploy. `build/csp.test.ts`
    # fails if this file drifts. Edit build/csp.ts, then paste the new line here.
    # Rationale for each directive: SECURITY.md "Content Security Policy".
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;

    location = / {
        return 301 /peek-a-bin/;
    }

    location /peek-a-bin/ {
        try_files $uri $uri/ /peek-a-bin/index.html;
    }

    location ~* \.(?:js|css|wasm|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Repeated because this block defines its own add_header (see note above).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/wasm;
    gzip_min_length 256;
}
