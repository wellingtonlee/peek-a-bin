name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `check` is a superset of `lint`: same rules, plus the formatter and
      # assist/source/organizeImports, and over the whole repo rather than
      # just src/. It was red for the project's entire history — 164 import-sort
      # errors across 9 src/ files, plus vite.config.ts, which the repo-wide
      # sort missed because it only covered src/. Both are fixed, so gate on it
      # rather than on `lint` alone; `lint` is now strictly implied.
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      # The build was previously only exercised on release tags, so a Vite/PWA
      # break could ship silently. Gate it on every PR instead.
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Threshold is `high`: one moderate advisory (@hono/node-server path
      # traversal) is pinned transitively by @modelcontextprotocol/sdk with no
      # upstream fix, and is unreachable here — the server uses stdio + ws,
      # not Hono serve-static.
      - run: npm audit --audit-level=high
